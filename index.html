        /* Bottom Lead Capture Form Section */
        .bottom-form-section {
            background-color: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 40px;
            margin-top: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .bottom-form-section h2 {
            font-size: 1.8rem;
            color: var(--brand-navy);
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .bottom-form-section p {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-group-full {
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: var(--bg-main);
            color: var(--text-dark);
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--brand-blue);
            background-color: #ffffff;
        }

        .submit-btn-wrap {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 15px;
        }

        .btn-submit {
            background-color: var(--brand-navy);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
